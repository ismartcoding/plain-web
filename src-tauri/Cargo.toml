[package]
name = "PlainApp"
version = "0.1.0"
description = "PlainApp Desktop"
authors = ["iSmartCoding"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "plainapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["sync", "macros", "net"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-log = "2"
# XChaCha20-Poly1305 for local server request encryption — required for security correctness.
chacha20poly1305 = "0.10"
# Self-signed TLS certificate generation for local HTTPS server.
# ring feature enables the required crypto backend (generate_simple_self_signed needs it).
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# Async TLS acceptor wrapping tokio streams. Uses ring backend to match rcgen.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
# SQLite for local chat/channel storage. Bundled builds SQLite from source — no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# ECDH P-256 (secp256r1) — matches Android CryptoHelper.generateECDHKeyPair() / computeECDHSharedKey().
p256 = { version = "0.13", default-features = false, features = ["ecdh", "pkcs8", "std"] }
# Ed25519 signing + verification — matches Android Tink Ed25519Verify (raw 32-byte public key).
ed25519-dalek = { version = "2", features = ["rand_core"] }
# SHA-256 for content-addressable file store.
sha2 = "0.10"
# CSPRNG used by ed25519-dalek key generation.
rand = "0.8"
# UUID v4 for persistent device client-id.
uuid = { version = "1", features = ["v4"] }
# Typed GraphQL schema with derive macros for clean resolver code.
async-graphql = { version = "7", default-features = false }
