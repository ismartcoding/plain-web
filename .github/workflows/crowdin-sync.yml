name: Crowdin — Sync Translations

# Pull approved translations from Crowdin on a weekly schedule and open a PR.
on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  sync-translations:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          # Do not let the action create its own PR — we do it ourselves after
          # converting the downloaded JSON files back to TypeScript.
          create_pull_request: false
          # Download into .crowdin/ as defined in crowdin.yml
          export_only_approved: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Convert .crowdin/*.json → src/locales/*.ts
        run: node scripts/i18n-json-to-ts.mjs

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: l10n/crowdin-translations
          base: main
          commit-message: 'chore(i18n): sync translations from Crowdin'
          title: 'chore(i18n): sync translations from Crowdin'
          body: |
            Automated translation sync via [Crowdin GitHub Action](https://github.com/crowdin/github-action).

            **What's in this PR**
            - Latest translations fetched from Crowdin for all supported locales
            - Only keys that have changed since the last sync are modified

            Review the file diffs and merge when the translations look correct.
            You can re-run the _Crowdin — Sync Translations_ workflow any time to refresh this PR.
          labels: 'i18n,automated'
          delete-branch: true
