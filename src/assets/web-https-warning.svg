<svg viewBox="60 40 280 220" xmlns="http://w3.org">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="10" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes gold-breathe {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.15); }
      }

      @keyframes shield-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @keyframes dash-flow-right {
        to { stroke-dashoffset: -12; }
      }

      @keyframes signal-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .guide-container { transform-origin: 200px 145px; }
      .breathe-circle { transform-origin: 200px 145px; animation: gold-breathe 2.5s infinite ease-in-out; }
      .shield-icon { transform-origin: 200px 145px; animation: shield-float 2.5s infinite ease-in-out; }
      .flow-line { animation: dash-flow-right 1.2s linear infinite; }
      .phone-signal { animation: signal-pulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="80" y="60" width="240" height="150" rx="16" fill="#FFFFFF" />
    <line x1="80" y1="92" x2="320" y2="92" stroke="#E5E5EA" stroke-width="1" />
  </g>

  <circle cx="98" cy="76" r="4" fill="#FF5F56" />
  <circle cx="110" cy="76" r="4" fill="#FFBD2E" />
  <circle cx="122" cy="76" r="4" fill="#27C93F" />

  <rect x="140" y="68" width="150" height="16" rx="8" fill="#FFF8EE" />
  <text x="152" y="79" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="bold" fill="#FF9500">http://</text>
  <text x="180" y="79" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#A9A9B0">screenmirror...</text>
  <circle cx="276" cy="76" r="4" fill="#FF9500" />
  <rect x="275.5" y="74" width="1" height="2.5" fill="#FFFFFF" rx="0.5" />
  <circle cx="276" cy="78" r="0.5" fill="#FFFFFF" />

  <rect x="100" y="124" width="26" height="42" rx="5" fill="none" stroke="#D1D1D6" stroke-width="2" />
  <circle cx="113" cy="161" r="1.5" fill="#D1D1D6" />
  <path class="phone-signal" d="M133 139 A 10 10 0 0 1 133 151" fill="none" stroke="#D1D1D6" stroke-width="1.5" stroke-linecap="round" />

  <rect x="254" y="133" width="36" height="24" rx="4" fill="none" stroke="#D1D1D6" stroke-width="2" />
  <path d="M266 157 L263 163 L281 163 L278 157 Z" fill="#D1D1D6" />

  <!-- 贯穿两端、顺畅从手机流向电脑的金色安全虚线 -->
  <path class="flow-line" d="M136 145 L264 145" fill="none" stroke="#FF9500" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <g class="guide-container">
    <circle class="breathe-circle" cx="200" cy="145" r="30" fill="#FF9500" />
    
    <circle cx="200" cy="145" r="22" fill="#FF9500" filter="url(#shadow)" />
    
    <g class="shield-icon">
      <path d="M194 142 V137 A 6 6 0 0 1 206 137 V142" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <path d="M189 142 H211 V151 C211 156 200 161 200 161 C200 161 189 156 189 151 Z" fill="#FFFFFF" />
      <circle cx="200" cy="149" r="1.5" fill="#FF9500" />
    </g>
  </g>
</svg>
